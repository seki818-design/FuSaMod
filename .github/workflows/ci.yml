name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm bench
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm --filter @fusamod/server build
      - name: E2E (Chromium)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && pnpm e2e

  sysml-integration:
    # 公式 SysML v2 実装(Java 21)との結合テスト。初回に約 120MB の jar を取得する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y unzip zstd
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: ./tools/sysml-check/run.sh

  docker:
    # イメージのビルドと起動確認(ヘルスチェック)。開発環境には Docker が無く、ここで初めて検証される。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fusamod .
      - run: |
          docker run -d --name fusamod -p 8787:8787 -e FUSAMOD_TOKENS='ci:0123456789abcdef0123' -e FUSAMOD_SYSML=snapshot fusamod
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/api/health && exit 0; sleep 2; done
          docker logs fusamod; exit 1
